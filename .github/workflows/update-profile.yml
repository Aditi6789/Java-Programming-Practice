name: Update Profile Daily
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Update Stats
        run: |
          COUNT=$(find src -name "*.java" | wc -l)
          DATE=$(date +"%d %b %Y")
          echo "Count is $COUNT"
          # README me stats block update
          awk -v count="$COUNT" -v date="$DATE" '
          /<!--START_STATS-->/ {print; print "- Total Java Files: " count; print "- Last Updated: " date; skip=1; next}
          /<!--END_STATS-->/ {skip=0}
          !skip
          ' README.md > temp.md && mv temp.md README.md
      - name: Commit
        run: |
          git config user.name "Aditi Bot"
          git config user.email "aditi6789@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "bot: update stats to $COUNT files [skip ci]"
          git push