name: Update Profile Daily
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Count Java Problems
        run: |
          COUNT=$(find src -name "*.java" | wc -l)
          echo "Found $COUNT java files"
          # README.md me count update karega agar line hai toh
          if grep -q "Problems Solved" README.md; then
            sed -i "s/[0-9]*+ Problems Solved/${COUNT}+ Problems Solved/" README.md || true
          fi

      - name: Commit and push
        run: |
          git config user.name "Aditi Bot"
          git config user.email "aditi6789@users.noreply.github.com"
          git add README.md || true
          git diff --staged --quiet || git commit -m "bot: auto update problem count [skip ci]"
          git push || echo "Nothing to push"